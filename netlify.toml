[build]
  command = "npm run build && node scripts/check-seo.mjs && node scripts/seo/quality.mjs --enforce-release"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Sites vitrines autonomes : le rendu et les données restent sur la plateforme.
[[redirects]]
  from = "/sites/*"
  to = "https://flexweb-gestion.netlify.app/sites/:splat"
  status = 200
  force = true

# Ressources Next.js utilisées par les sites autonomes servis ci-dessus.
[[redirects]]
  from = "/_next/*"
  to = "https://flexweb-gestion.netlify.app/_next/:splat"
  status = 200
  force = true

# Render generated drafts only on the isolated review deployment.
[context.deploy-preview.environment]
  FLEXWEB_DRAFT_PREVIEW = "1"

[[headers]]
  for = "/preparation/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
