[build]
  command = "test -s public/index.html && test -s public/en/index.html"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; frame-ancestors https://flex-web.fr https://www.flex-web.fr; form-action 'self'; base-uri 'none'; object-src 'none'"
