<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,follow"><title>Envoyer un message à Flex-Web</title><link rel="stylesheet" href="/form.css"><script type="module" src="/frame.mjs"></script></head><body><main><section class="fw-contact-form" id="contact-form" aria-labelledby="fw-contact-title">
    <h2 id="fw-contact-title">Envoyer un message</h2>
    <form action="/merci/" name="flexweb-contact" method="post" data-netlify="true" data-netlify-honeypot="bot-field" data-flexweb-contact
      data-sending="Envoi en cours…" data-success="Merci, votre message a bien été reçu." data-error="L’envoi n’a pas pu être confirmé. Votre saisie est conservée. Réessayez ou contactez-nous par téléphone.">
      <input type="hidden" name="form-name" value="flexweb-contact">
      <input type="hidden" name="language" value="fr">
      <p hidden aria-hidden="true"><label>Laissez ce champ vide<input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <label for="fw-contact-name">Nom (facultatif)</label>
      <input id="fw-contact-name" name="name" autocomplete="name" maxlength="120">
      <label for="fw-contact-email">Votre e-mail</label>
      <input id="fw-contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="fw-contact-topic">Sujet</label>
      <select id="fw-contact-topic" name="topic"><option value="general">Question générale</option><option value="quote">Demande de devis</option><option value="partnership">Partenariat</option><option value="privacy">Données personnelles</option></select>
      <label for="fw-contact-message">Votre message</label>
      <textarea id="fw-contact-message" name="message" rows="5" maxlength="3000" required></textarea>
      <div class="fw-contact-privacy">
        <label><input type="checkbox" name="consent" value="yes" required><span>J’accepte que Flex-Web me recontacte au sujet de ce message.</span></label>
        <a href="https://flex-web.fr/privacy/" target="_blank" rel="noopener">Confidentialité</a>
      </div>
      <button type="submit">Envoyer mon message</button>
    </form>
    <p role="status" aria-live="polite" data-contact-status tabindex="-1"></p>
  </section><script type="module" src="/form.mjs"></script></main></body></html>
