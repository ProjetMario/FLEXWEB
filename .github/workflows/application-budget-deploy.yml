name: Application budget — production verification

on:
  push:
    branches: [codex/application-budget-live-20261122]
    paths:
      - 'scripts/cms/application-budget-verify.mjs'
      - '.github/workflows/application-budget-deploy.yml'

permissions:
  contents: read

concurrency:
  group: emdash-publication-flex-webb
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ProjetMario/FLEXWEB' && github.ref == 'refs/heads/codex/application-budget-live-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: emdash-publication
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CONTEXT: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Production 6b02c2a45950df733ff5a331 is already published. This final
      # workflow only reads it; it cannot trigger another Netlify deployment.
      - name: Verify the published page and every preserved file
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 5f0ec4e5-fe16-4ef3-8380-9b8aff26edbb
        run: node scripts/cms/application-budget-verify.mjs
      - name: Archive publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-budget-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cms/application-budget-verification-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
