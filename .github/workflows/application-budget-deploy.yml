name: Application budget — one-page publication

on:
  push:
    branches: [codex/application-budget-live-20261122]
    paths:
      - 'src/components/onboarding/StartProject.jsx'
      - 'src/styles/quote-form.css'
      - 'tests/application-budget.test.mjs'
      - 'scripts/cms/application-budget-deploy.mjs'
      - '.github/workflows/application-budget-deploy.yml'

permissions:
  contents: read

concurrency:
  group: emdash-publication-flex-webb
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ProjetMario/FLEXWEB' && github.ref == 'refs/heads/codex/application-budget-live-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: emdash-publication
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CONTEXT: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and isolated browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compile only the quote form page
        shell: bash
        run: |
          set -euo pipefail
          pages_backup="$RUNNER_TEMP/application-budget-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mv src/pages "$pages_backup"
          mkdir src/pages
          cp "$pages_backup/demarrer.astro" src/pages/demarrer.astro
          trap 'rm src/pages/demarrer.astro; rmdir src/pages; mv "$pages_backup" src/pages' EXIT
          npx astro build
      - name: Verify scoped draft and publish the same complete snapshot
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 5f0ec4e5-fe16-4ef3-8380-9b8aff26edbb
        run: node scripts/cms/application-budget-deploy.mjs
      - name: Archive release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cms/application-budget-deploy-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
