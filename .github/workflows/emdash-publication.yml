name: EmDash form-only production hotfix
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: emdash-publication-flex-webb
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/form-only-production-hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: emdash-publication
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 5f0ec4e5-fe16-4ef3-8380-9b8aff26edbb
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=6144
      FLEXWEB_FR_CH_EXPANSION: '1'
      CONTEXT: production
      HOTFIX_BASELINE_DIR: ${{ runner.temp }}/published-dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser for isolated form tests
        run: npx playwright install --with-deps chromium
      - name: Retrieve published immutable snapshot
        run: |
          gh run download 43240669026 --repo ProjetMario/FLEXWEB --name emdash-publication-43240669026-1 --dir "$RUNNER_TEMP/published-evidence"
          mkdir -p .cms
          cp "$RUNNER_TEMP/published-evidence/releases/bb776963c9ca620d92c53047210d5f2b838d67d06555a4e9a5aabf98812beeeb.json" .cms/snapshot.json
      - name: Reproduce and verify the currently published files
        run: |
          git reset --hard c2a9eaae945a93d5afa9dd070d8aa825b8270667
          npm run build > "$RUNNER_TEMP/baseline-build.log" 2>&1
          mv dist "$HOTFIX_BASELINE_DIR"
          git reset --hard "$GITHUB_SHA"
          node scripts/cms/form-hotfix.mjs baseline
      - name: Build the correction and select only its two pages and assets
        run: |
          npm run build > "$RUNNER_TEMP/candidate-build.log" 2>&1
          node --import tsx --test tests/analytics.test.mjs tests/openai-pixel.test.mjs
          node scripts/cms/form-hotfix.mjs prepare
      - name: Verify the scoped artifact with mocked form submissions
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory "$HOTFIX_BASELINE_DIR" > "$RUNNER_TEMP/preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          node --test tests/quote-flow.test.mjs
      - name: Publish only the verified changed files
        run: node scripts/cms/form-hotfix.mjs publish
      - name: Archive file scope and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-only-hotfix-${{ github.run_id }}
          path: |
            .cms/form-hotfix-report.json
            ${{ runner.temp }}/baseline-build.log
            ${{ runner.temp }}/candidate-build.log
          include-hidden-files: true
          retention-days: 30
