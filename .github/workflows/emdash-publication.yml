name: EmDash controlled publication

on:
  workflow_dispatch:
  schedule:
    # One current snapshot per batch; unchanged revisions do not rebuild.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'apps/saas-platform/**'
      - 'outputs/**'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: emdash-publication-flex-webb
  cancel-in-progress: false

jobs:
  publish:
    if: vars.ENABLE_EMDASH_PUBLICATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: emdash-publication
    env:
      ENABLE_EMDASH_PUBLICATION: ${{ vars.ENABLE_EMDASH_PUBLICATION }}
      EMDASH_URL: ${{ vars.EMDASH_URL }}
      EMDASH_READ_TOKEN: ${{ secrets.EMDASH_READ_TOKEN }}
      EMDASH_WRITE_TOKEN: ${{ secrets.EMDASH_WRITE_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 5f0ec4e5-fe16-4ef3-8380-9b8aff26edbb
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated browser for mocked form checks
        run: npx playwright install --with-deps chromium
      - name: Test publication safeguards
        run: npm run cms:test
      - name: Test IndexNow with simulated provider
        run: node --test scripts/seo/indexnow-submit.test.mjs
      - name: Restore IndexNow receipt ledger
        uses: actions/cache/restore@v4
        with:
          path: .cms/indexnow-state.json
          key: flexweb-indexnow-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flexweb-indexnow-v2-
      - name: Snapshot, build once, verify preview, promote the same deployment
        run: node scripts/cms/release.mjs
      - name: Notify IndexNow for changed priority URLs
        if: success()
        run: node scripts/seo/indexnow-submit.mjs
      - name: Persist IndexNow receipts and uncertain attempts
        if: always() && hashFiles('.cms/indexnow-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cms/indexnow-state.json
          key: flexweb-indexnow-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive immutable snapshot and publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emdash-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cms/publication-report.json
            .cms/indexnow-report.json
            .cms/indexnow-state.json
            .cms/releases/*.json
            .cms/smoke/*.png
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore
