name: Nova Habitat — publication Netlify
on:
  push:
    branches: [nova-habitat]
    paths: ['site/**', 'scripts/**', 'assets.json', 'package.json', 'package-lock.json', '.github/workflows/nova-habitat.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-habitat-5215a04e-7872-45e3-b354-fc8f994d2219
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: emdash-publication
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AGENT: chatgpt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Netlify SDK
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy complete storefront preview and verify preservation of production
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {NetlifyAPI,methods} from '@netlify/api';
          import {mkdir,writeFile,readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const api=new NetlifyAPI(process.env.NETLIFY_AUTH_TOKEN);
          const site_id='5215a04e-7872-45e3-b354-fc8f994d2219';
          const report={published:false,operation:'storefront-preview',sourceCommit:process.env.GITHUB_SHA};
          const sha=b=>createHash('sha1').update(b).digest('hex');
          const check=(ok,msg)=>{if(!ok)throw Error(msg)};
          const fetchBytes=async url=>{const r=await fetch(url,{signal:AbortSignal.timeout(30000)});check(r.ok,`Asset HTTP ${r.status}`);return Buffer.from(await r.arrayBuffer())};
          await mkdir('.work',{recursive:true});
          try{
            const site=await api.getSite({site_id});
            check(site.name==='nova-habitat-demo-flexweb','Wrong project');
            const original=await api.getDeploy({deploy_id:site.published_deploy.id});
            const entries=await api.listSiteFiles({site_id});
            check(entries.every(f=>f.deploy_id===original.id),'Production changed');
            const patch=new Map();
            for(const file of ['index.html','nova-v2.css','nova-v2.js','nova-forms.html','merci-nova.html'])patch.set('/'+file,await readFile('site/'+file));
            const assets=JSON.parse(await readFile('assets.json','utf8'));
            for(const image of assets.images)patch.set('/'+image.file,await fetchBytes(image.url));
            const files=Object.fromEntries(entries.map(f=>[f.path,f.sha]));
            for(const [path,bytes] of patch)files[path]=sha(bytes);
            const draft=await api.createSiteDeploy({site_id,title:'Nova Habitat — refonte complète depuis GitHub (aperçu)',body:{files,draft:true,async:false}});
            report.previewId=draft.id;
            report.requiredFileCount=draft.required?.length;
            check(!(draft.required_functions||[]).length,'Unexpected function upload');
            const bySha=new Map([...patch].map(([path,bytes])=>[sha(bytes),{path,bytes}]));
            for(const digest of draft.required||[]){
              const file=bySha.get(digest);check(file,'Unexpected original asset request');
              await api.uploadDeployFile({deploy_id:draft.id,path:file.path.replace(/^\//,''),size:file.bytes.length,body:file.bytes});
            }
            let deployed;
            for(let i=0;i<70;i++){
              deployed=await api.getDeploy({deploy_id:draft.id});
              if(['ready','error','rejected'].includes(deployed.state))break;
              await new Promise(r=>setTimeout(r,2000));
            }
            check(deployed.state==='ready','Preview not ready');
            const url=`https://${draft.id}--nova-habitat-demo-flexweb.netlify.app`;
            report.previewUrl=url;
            const html=(await fetchBytes(url+'/')).toString('utf8');
            for(const id of ['curage','toiture','jardins','devis'])check(html.includes(`id="${id}"`),'Missing section '+id);
            check((html.match(/pas une réalisation Nova Habitat/g)||[]).length>=3,'AI disclaimers missing');
            const logo=await fetchBytes(url+'/logo-nova-habitat.jpg');
            report.logoUnchanged=createHash('sha256').update(logo).digest('hex')===assets.logo_sha256;
            check(report.logoUnchanged,'Logo changed');
            report.forms=(await api.listSiteForms({site_id})).map(f=>({id:f.id,name:f.name,fields:f.fields}));
            report.snippets=(await api.listSiteSnippets({site_id})).map(s=>({id:s.id,title:s.title,general_position:s.general_position}));
            report.emailHookTypes=(await api.listHookTypes()).filter(h=>/email/i.test(h.name));
            report.assetMethods=methods.filter(m=>/SiteAsset|SiteSnippet/.test(m.operationId)).map(m=>({name:m.operationId,parameters:m.parameters}));
            const final=await api.getSite({site_id});
            report.productionUnchanged=final.published_deploy.id===original.id;
            check(report.productionUnchanged,'Unexpected production change');
            report.previewVerified=true;
          }catch(e){report.error=String(e.message);report.http=e.status;process.exitCode=1;}
          await writeFile('.work/storefront-preview.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-habitat-publication-${{ github.run_id }}
          path: .work/storefront-preview.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
