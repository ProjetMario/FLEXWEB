name: Nova Habitat — publication Netlify
on:
  push:
    branches: [nova-habitat]
    paths: ['site/**', 'scripts/**', 'assets.json', 'package.json', 'package-lock.json', '.github/workflows/nova-habitat.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-habitat-5215a04e-7872-45e3-b354-fc8f994d2219
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: emdash-publication
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AGENT: chatgpt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deployment SDK and browser validation
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Check source syntax
        run: |
          node --check site/nova-v2.js
          node --check scripts/publish-presentation.mjs
          node --check scripts/publish-forms.mjs
      - name: Publish permanent quotation receiver
        run: node scripts/publish-forms.mjs
      - name: Recognize only the explicit deployment test in spam, without changing spam filtering
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const endpoint=JSON.parse(await readFile('.work/form-endpoint.json','utf8'));
          if(endpoint.siteId!=='7f29049b-1c35-44a6-9d01-1881e7f2a42b'||!endpoint.formId)throw Error('Unexpected form receiver');
          const headers={Authorization:`Bearer ${process.env.NETLIFY_AUTH_TOKEN}`};
          // Documented Netlify endpoints for spam review and restoring a legitimate test:
          // https://docs.netlify.com/api-and-cli-guides/api-guides/get-started-with-api/#get-spam-submissions
          const r=await fetch(`https://api.netlify.com/api/v1/forms/${endpoint.formId}/submissions?state=spam`,{headers,signal:AbortSignal.timeout(30000)});
          if(!r.ok)throw Error(`Spam verification HTTP ${r.status}`);
          const entries=await r.json();
          const test=entries.find(s=>s.data?.nom==='NOVA-HABITAT-DEPLOYMENT-CHECK-V2'&&s.data?.email==='73novahabitat@gmail.com'&&String(s.data?.message).startsWith('Test technique de mise en ligne du formulaire Nova Habitat.'));
          const result={unrelatedSubmissionsChanged:false,spamProtectionDisabled:false,knownTestFound:Boolean(test)};
          if(test){
            const changed=await fetch(`https://api.netlify.com/api/v1/submissions/${test.id}/ham`,{method:'PUT',headers,signal:AbortSignal.timeout(30000)});
            if(!changed.ok)throw Error(`Test verification HTTP ${changed.status}`);
            result.testId=test.id;result.technicalTestMarkedVerified=true;
          }
          await writeFile('.work/technical-test-status.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result));
          JS
      - name: Verify real form reception and publish the homepage without changing its historical backend
        run: node scripts/publish-presentation.mjs
      - name: Save publication and browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-habitat-publication-${{ github.run_id }}
          path: |
            .work/presentation-report.json
            .work/form-service-report.json
            .work/form-endpoint.json
            .work/technical-test-status.json
            .work/nova-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
