name: EmDash publication unit checks

on:
  pull_request:
    paths:
      - 'scripts/cms/**'
      - '.github/workflows/emdash*'
      - 'apps/content-cms/**'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - 'scripts/cms/**'
      - '.github/workflows/emdash*'
      - 'apps/content-cms/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  safeguards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run cms:test
  cms-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/content-cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/content-cms/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
